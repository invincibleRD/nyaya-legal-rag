server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # single page app, every unknown path is a route not a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
