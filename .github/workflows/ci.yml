name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/invinciblerd/nyaya-legal-rag-backend
  COVERAGE_MIN_LINES: 60

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # threshold lives here so it is enforced in CI even if vitest.config changes
      - run: npm run test:cov -- --coverage.thresholds.lines=${{ env.COVERAGE_MIN_LINES }}
        working-directory: backend
      - uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: coverage
          path: backend/coverage
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - id: check
        run: test -f frontend/package-lock.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4.1.0
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci && npm run build
        working-directory: frontend

  retrieval:
    # the golden set needs a live index, which only the self-hosted box has.
    # fork PRs never reach it, same guard as build.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: golden set regression gate
        working-directory: backend
        env:
          QDRANT_URL: http://localhost:6333
          EMBEDDING_URL: http://localhost:8081
          RERANKER_URL: http://localhost:8082
          RERANK_ENABLED: 'true'
          # the bm25 stats live beside the deployed corpus, not in the checkout.
          # without them the sparse leg is skipped and the test self-skips.
          DATA_DIR: /home/ubuntu/hrn+/new/data
        run: npx vitest run tests/retrieval.eval.test.js

  build:
    # fork PRs never reach the self-hosted runner
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test, secrets]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/build-push-action@v6.10.0
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - uses: docker/login-action@v3.3.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.10.0
        if: github.event_name == 'push'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: nyaya
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: roll out
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q api)" \
            > ~/nyaya-previous-image 2>/dev/null || true
          docker compose -f docker-compose.yml -f .github/deploy/compose.deploy.yml pull api worker
          docker compose -f docker-compose.yml -f .github/deploy/compose.deploy.yml up -d --no-deps api worker

      - name: wait for health
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && exit 0
            sleep 5
          done
          docker compose -f docker-compose.yml -f .github/deploy/compose.deploy.yml logs --tail=50 api
          exit 1

      - name: record good image
        run: echo "${{ env.IMAGE }}:${{ github.sha }}" > ~/nyaya-current-image
