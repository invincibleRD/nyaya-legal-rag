name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/invinciblerd/nyaya-legal-rag-backend
  COVERAGE_MIN_LINES: 60

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # threshold lives here so it is enforced in CI even if vitest.config changes
      - run: npm run test:cov -- --coverage.thresholds.lines=${{ env.COVERAGE_MIN_LINES }}
        working-directory: backend
      - uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: coverage
          path: backend/coverage
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - id: check
        run: test -f frontend/package-lock.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4.1.0
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci && npm run build
        working-directory: frontend

  retrieval:
    # the golden set needs a live index, which only the self-hosted box has.
    # fork PRs never reach it, same guard as build.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: golden set regression gate
        working-directory: backend
        env:
          QDRANT_URL: http://localhost:6333
          EMBEDDING_URL: http://localhost:8081
          RERANKER_URL: http://localhost:8082
          RERANK_ENABLED: 'true'
          # the bm25 stats live beside the deployed corpus, not in the checkout.
          # without them the sparse leg is skipped and the test self-skips.
          DATA_DIR: /home/ubuntu/hrn+/new/data
        run: npx vitest run tests/retrieval.eval.test.js

  build:
    # fork PRs never reach the self-hosted runner
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test, secrets]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      # no type=gha cache here: the runner is a long lived box that keeps its own
      # layers, and the actions cache service returns html error pages to
      # self-hosted runners often enough to fail the build on its own
      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/build-push-action@v6.10.0
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          # unfixed CVEs in the debian base have no patch to apply, so failing on
          # them means the build can never go green. anything with a fix still fails.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - uses: docker/login-action@v3.3.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.10.0
        if: github.event_name == 'push'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: nyaya
      # the runner's own workspace has no .env (gitignored, rightly) and no data
      # volumes, so compose is run from the real deployment checkout instead
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/hrn+/new' }}
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.gpu.yml -f .github/deploy/compose.deploy.yml
    steps:
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: move the deployment to this commit
        run: |
          test -f "$DEPLOY_DIR/.env" || { echo "no .env in $DEPLOY_DIR"; exit 1; }
          cd "$DEPLOY_DIR"
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --force "$GITHUB_SHA"
          git log --oneline -1

      - name: roll out
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          cd "$DEPLOY_DIR"
          docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q api)" \
            > ~/nyaya-previous-image 2>/dev/null || true
          docker compose $COMPOSE_FILES pull api worker
          docker compose $COMPOSE_FILES up -d --no-deps api worker

      - name: wait for health
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          cd "$DEPLOY_DIR"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && exit 0
            sleep 5
          done
          docker compose $COMPOSE_FILES logs --tail=50 api
          exit 1

      - name: roll back to the last good image
        if: failure()
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          cd "$DEPLOY_DIR"
          prev=$(cat ~/nyaya-previous-image 2>/dev/null || true)
          [ -n "$prev" ] || { echo "no previous image recorded, leaving as is"; exit 0; }
          echo "rolling back to $prev"
          BACKEND_IMAGE="$prev" docker compose $COMPOSE_FILES up -d --no-deps api worker

      - name: record good image
        run: echo "${{ env.IMAGE }}:${{ github.sha }}" > ~/nyaya-current-image

  # The vercel production alias follows whatever branch the dashboard calls
  # production, which is not visible from the repo. Promoting explicitly here
  # makes main the production url regardless of that setting.
  vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: promote main to the vercel production url
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "vercel secrets are not set, skipping."
            echo "add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to make"
            echo "every main merge publish to the production url."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
