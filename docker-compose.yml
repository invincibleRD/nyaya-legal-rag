name: nyaya

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nyaya]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nyaya]

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-base-en-v1.5", "--port", "80"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks: [nyaya]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-base", "--port", "80"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    networks: [nyaya]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      EMBEDDING_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # the eval harness is a tool, not part of the shipped image
      - ./eval:/app/eval
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    networks: [nyaya]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "src/workers/main.js"]
    # runs the api image, so it inherits an http healthcheck it can never pass
    healthcheck:
      disable: true
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      EMBEDDING_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    networks: [nyaya]

  frontend:
    build:
      context: ./frontend
      args:
        # the browser calls the api directly, so this is the public origin
        VITE_API_URL: ${PUBLIC_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on: [api]
    networks: [nyaya]

volumes:
  qdrant_data:
  redis_data:
  hf_cache:

networks:
  nyaya:
