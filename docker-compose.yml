name: nyaya

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nyaya]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nyaya]

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-base-en-v1.5", "--port", "80"]
    ports:
      - "8081:80"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks: [nyaya]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      EMBEDDING_URL: http://embeddings:80
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    networks: [nyaya]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "src/workers/main.js"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      EMBEDDING_URL: http://embeddings:80
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    networks: [nyaya]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on: [api]
    networks: [nyaya]

volumes:
  qdrant_data:
  redis_data:
  hf_cache:
  app_data:

networks:
  nyaya:
